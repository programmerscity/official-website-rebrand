<!-- ======= TRAINING PROGRAMS SECTION START ======= -->
<section class="py-16 lg:py-24 bg-main-theme">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col gap-12 items-center">

    <!-- Section Header -->
    <div class="text-center max-w-2xl mx-auto">
      <h1 class="text-3xl md:text-[40px] text-secondary font-bold leading-tight mb-3">
        Our Training Programs
      </h1>
      <p class="text-lg md:text-xl text-secondary-light font-normal">
        Comprehensive courses designed to launch your tech career and equip you with the skills needed to excel in the industry.
      </p>
    </div>

    <!-- Dynamic Grid Container -->
    <div id="featured-courses-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 lg:gap-8 w-full">
      <!-- Courses will be injected here by JavaScript -->
    </div>

    <!-- Explore More Button -->
    <a href="https://enroll.programmerscity.com/app/index.php#courses" target="_blank"
      class="w-full max-w-xs mx-auto text-center bg-primary hover:bg-primary-dark text-white font-medium py-3.5 px-8 rounded-full shadow-lg shadow-primary/20 hover:shadow-primary/30 transition-all duration-300">
      Explore More Courses
    </a>

  </div>
</section>
<!-- ======= TRAINING PROGRAMS SECTION END ======= -->


<!-- ======= JavaScript for API Integration ======= -->
<script>
  document.addEventListener('DOMContentLoaded', async () => {
    const container = document.getElementById('featured-courses-container');
    const targetIds = [5, 6, 7, 1, 9, 10]; // Fullstack Python, Data Analysis, React Native

    // Fallback placeholder image if API returns a null/empty image
    const PLACEHOLDER_IMAGE = "https://placehold.co/600x400/e2e8f0/475569?text=Course+Preview";

    // Helper to format price to Naira (e.g., 150000 -> ₦150,000)
    const formatPrice = (price) => {
      if (!price) return '₦0';
      const numericPrice = Number(price);
      
      if (isNaN(numericPrice)) return '₦0';
      return `₦${numericPrice.toLocaleString()}`;
    };

    try {
      const response = await fetch('https://enroll.programmerscity.com/api/courses/fetch-courses.php');

      if (!response.ok) throw new Error('Network response was not ok');

      const data = await response.json();

      // If the API returns an object with nested data, adjust this. Assuming it returns an array.
      const coursesArray = Array.isArray(data) ? data : data.data || [];

      // Filter for the specific IDs required
      const featuredCourses = coursesArray.filter(course => targetIds.includes(Number(course.id)));

      // If API returns them out of order, sort them to match [5, 6, 7] strictly
      featuredCourses.sort((a, b) => targetIds.indexOf(Number(a.id)) - targetIds.indexOf(Number(b.id)));

      if (featuredCourses.length === 0) {
        container.innerHTML = `<p class="col-span-full text-center text-secondary-light">No courses found at the moment.</p>`;
        return;
      }
      

      // Generate HTML for each course
      container.innerHTML = featuredCourses.map(course => {
        // Safely extract properties or fallback
        const title = course.title || 'Course Title';
        const description = course.short_desc || 'No description available.';
        const price =course.price;
        const imageUrl = course.image || PLACEHOLDER_IMAGE; // Fallback if image not provided
        const courseId = course.id;

        return `
                    <div class="bg-white border border-theme-light rounded-2xl overflow-hidden shadow-sm hover:shadow-xl transition-all duration-300 flex flex-col group">
                        <!-- Image -->
                        <div class="w-full h-52 overflow-hidden relative">
                            <img src="${imageUrl}" alt="${title}" 
                                 class="w-full h-full object-cover transform transition-transform duration-500 group-hover:scale-105" 
                                 loading="lazy" 
                                 onerror="this.onerror=null; this.src='${PLACEHOLDER_IMAGE}';" />
                        </div>

                        <!-- Content -->
                        <div class="p-6 flex flex-col flex-1">
                            <!-- Header Row: Title & Price -->
                            <div class="flex justify-between items-start mb-3 gap-4">
                                <h3 class="text-xl font-bold text-secondary leading-tight">${title}</h3>
                                <span class="shrink-0 bg-primary-light/95 text-primary font-semibold text-sm px-3 py-1 rounded-full mt-1">${price}</span>
                            </div>

                            <!-- Description -->
                            <p class="text-secondary-light text-[15px] leading-relaxed mb-6 flex-1">
                                ${description}
                            </p>

                            <!-- Action Buttons -->
                            <div class="flex gap-3 mt-auto">
                                <!--<a href="#" class="flex-1 text-center py-2.5 border-2 border-secondary text-secondary font-medium rounded-full hover:bg-secondary-light hover:text-white transition-colors duration-300">
                                    Details
                                </a>-->
                                <a href="https://enroll.programmerscity.com/app/enroll.php?course_id=${courseId}" target="_blank" class="flex-1 text-center py-2.5 border border-primary text-primary hover:text-white font-medium rounded-full hover:bg-primary-dark shadow-md shadow-primary/20 transition-all duration-300 hover:-translate-y-0.5">
                                    Enroll Now
                                </a>
                            </div>
                        </div>
                    </div>
                `;
      }).join('');

    } catch (error) {
      console.error('Failed to fetch courses:', error);
      container.innerHTML = `
                <div class="col-span-full text-center p-8 bg-theme-light rounded-xl border border-secondary-light/20">
                    <p class="text-secondary-light font-medium mb-3">Oops! We couldn't load our courses right now.</p>
                    <a href="https://enroll.programmerscity.com/app/index.php#courses" target="_blank" class="text-primary hover:text-primary-dark underline">Visit our program page to browse all courses.</a>
                </div>
            `;
    }
  });
</script>
<!-- ======= End JavaScript ======= -->
