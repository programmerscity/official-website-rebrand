<!-- CONTACT FORM & MAP SECTION -->
<section class="py-16 lg:py-24 bg-main-theme">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 lg:gap-12">

            <!-- Left Column: Contact Form -->
            <aside data-aos="fade-right" data-aos-duration="800" data-aos-easing="ease-out"
                class="bg-white p-6 sm:p-8 lg:p-10 rounded-3xl shadow-lg border border-theme-light/30 flex flex-col gap-6">
                <div>
                    <h2 class="text-2xl lg:text-3xl font-bold text-secondary mb-2">Send Us A Message</h2>
                    <p class="text-secondary-light text-sm lg:text-base font-normal">
                        Tell us about your project or what you need help with.
                    </p>
                </div>

                <!-- Form with explicit ID -->
                <form id="contactForm" class="flex flex-col gap-5 w-full">

                    <div class="flex flex-col gap-1.5">
                        <label for="fullname" class="text-sm font-semibold text-secondary">Full Name <span
                                class="text-primary">*</span></label>
                        <input type="text" id="fullname" name="fullname" placeholder="Enter your name" required
                            class="w-full px-4 py-3 rounded-xl border border-theme-light/70 bg-main-theme/40 focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all duration-200 placeholder:text-secondary-light/50 text-secondary">
                    </div>

                    <div class="flex flex-col gap-1.5">
                        <label for="email" class="text-sm font-semibold text-secondary">Email Address <span
                                class="text-primary">*</span></label>
                        <input type="email" id="email" name="email" placeholder="Enter your email" required
                            class="w-full px-4 py-3 rounded-xl border border-theme-light/70 bg-main-theme/40 focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all duration-200 placeholder:text-secondary-light/50 text-secondary">
                    </div>

                    <div class="flex flex-col gap-1.5">
                        <label for="phone" class="text-sm font-semibold text-secondary">Phone Number</label>
                        <input type="tel" id="phone" name="phone" placeholder="Enter your phone number"
                            class="w-full px-4 py-3 rounded-xl border border-theme-light/70 bg-main-theme/40 focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all duration-200 placeholder:text-secondary-light/50 text-secondary">
                    </div>

                    <div class="flex flex-col gap-1.5">
                        <label for="subject" class="text-sm font-semibold text-secondary">Subject <span
                                class="text-primary">*</span></label>
                        <input type="text" id="subject" name="subject" placeholder="Enter the subject" required
                            class="w-full px-4 py-3 rounded-xl border border-theme-light/70 bg-main-theme/40 focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all duration-200 placeholder:text-secondary-light/50 text-secondary">
                    </div>

                    <div class="flex flex-col gap-1.5">
                        <label for="message" class="text-sm font-semibold text-secondary">How can we help you? <span
                                class="text-primary">*</span></label>
                        <textarea name="message" id="message" required rows="4"
                            class="w-full px-4 py-3 rounded-xl border border-theme-light/70 bg-main-theme/40 focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all duration-200 placeholder:text-secondary-light/50 text-secondary resize-none"
                            placeholder="Describe your inquiry..."></textarea>
                    </div>

                    <!-- Status Message Container -->
                    <div id="form-status" class="mt-2"></div>

                    <div class="pt-2">
                        <button id="submitBtn" type="submit"
                            class="w-full sm:w-auto bg-primary text-white font-medium py-3.5 px-8 rounded-full shadow-lg shadow-primary/20 hover:bg-primary-dark hover:shadow-primary/30 hover:-translate-y-0.5 transition-all duration-300 flex items-center justify-center gap-2">
                            <span>Send Message</span>
                        </button>
                    </div>
                </form>
            </aside>

            <!-- Right Column: Google Maps -->
            <aside data-aos="fade-left" data-aos-duration="800" data-aos-easing="ease-out" data-aos-delay="200"
                class="h-full flex flex-col">
                <!-- Actual Map Embed Link: https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3971.6371840222655!2d7.034553874728043!3d5.4718809344903585!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x10425eb554f4c57b%3A0xdc75dc624ad32894!2sProgrammers%20City%20Software%20Hub!5e0!3m2!1sen!2sng!4v1783271704484!5m2!1sen!2sng -->
                <div
                    class="w-full h-full min-h-100 lg:min-h-full rounded-3xl overflow-hidden shadow-lg border border-theme-light/30 bg-white p-2">
                    <iframe
                        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3971.6371840222655!2d7.034553874728043!3d5.4718809344903585!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x10425eb554f4c57b%3A0xdc75dc624ad32894!2sProgrammers%20City%20Software%20Hub!5e0!3m2!1sen!2sng!4v1783271704484!5m2!1sen!2sng"
                        width="100%" height="100%" style="border:0;" allowfullscreen="" loading="lazy"
                        referrerpolicy="no-referrer-when-downgrade" class="w-full h-full rounded-2xl object-cover"
                        title="Programmers City Office Location, Owerri, Nigeria">
                    </iframe>
                </div>
            </aside>

        </div>
    </div>
</section>

<!-- JavaScript Handling Async POST and Loading State -->
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const form = document.getElementById('contactForm');
        const submitBtn = document.getElementById('submitBtn');
        const formStatus = document.getElementById('form-status');

        if (service) {
            document.querySelector('input[name="subject"]').value = service;
        }

        if (status) {
            formStatus.className = 'p-4 rounded-xl bg-green-50 text-green-700 border border-green-200';
            formStatus.innerHTML = `<p>${status}</p>`;
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            formStatus.innerHTML = '';
            formStatus.className = '';

            submitBtn.disabled = true;
            submitBtn.innerHTML = `
        <div class="flex items-center justify-center gap-2">
            <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <span>Sending...</span>
        </div>
    `;

            try {
                const formData = new FormData(form);
                const response = await fetch('contact-send.php', {
                    method: 'POST',
                    body: formData
                });

                // Check if response is JSON
                const contentType = response.headers.get('content-type');
                if (!contentType || !contentType.includes('application/json')) {
                    throw new Error('Server returned non-JSON response. Please try again.');
                }

                const data = await response.json();

                if (data.status === 'success') {
                    form.reset();
                    formStatus.className = 'p-4 rounded-xl bg-green-50 text-green-700 border border-green-200';
                    formStatus.innerHTML = `<p>${data.message}</p>`;
                } else {
                    formStatus.className = 'p-4 rounded-xl bg-red-50 text-red-700 border border-red-200';
                    formStatus.innerHTML = `<p>${data.message}</p>`;
                }
            } catch (error) {
                console.error('Fetch error:', error);
                formStatus.className = 'p-4 rounded-xl bg-red-50 text-red-700 border border-red-200';
                formStatus.innerHTML = `<p>An unexpected error occurred: ${error.message}</p>`;
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = `<span>Send Message</span>`;
            }
        });
    });
</script>
